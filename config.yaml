ollama:
  host: "http://localhost:11434"
  model: "qwen2.5-coder:1.5b"
  keep_alive: "30m"
  stream: true
  options:
    temperature: 0.2
    num_ctx: 2048
    num_thread: 4    # set to your core count (Mac mini / Ubuntu server = 4–8)
    num_predict: 512 # max tokens per response; raise for long file writes, lower for faster replies

agent:
  max_history: 8
  step_timeout_seconds: 300  # per-step deadline in goal mode (5 min); 0 = no timeout
  max_goal_steps: 10         # maximum steps before goal mode stops
  system_prompt: |
    You are a local coding assistant. For file/shell actions output ONLY a raw JSON object with no other text:
    {"name":"write_file","arguments":{"path":"file","content":"text"}}
    {"name":"read_file","arguments":{"path":"file"}}
    {"name":"append_file","arguments":{"path":"file","content":"text"}}
    {"name":"list_dir","arguments":{"path":"."}}
    {"name":"run_command","arguments":{"command":"ls","args":["-la"]}}
    For all other responses use plain text only, never JSON.

tools:
  enabled: true
  use_native_tools: false
  enable_read_file: true
  enable_write_file: true
  enable_append_file: true
  enable_list_dir: true
  enable_run_command: true
  confirm_run_command: true
  confirm_write_file: false   # set true to prompt before overwriting existing files
  allowed_commands:
    - cat
    - ls
    - pwd
    - grep
    - find
    - head
    - tail
    - sed
    - awk
