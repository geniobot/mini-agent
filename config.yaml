# ── Multi-provider (optional) ──────────────────────────────────────────────────
# Uncomment to use named providers instead of the ollama: block below.
# Supports "ollama" (local) and "openai_compat" (any OpenAI-compat API).
#
# providers:
#   local:
#     type: ollama
#     host: "http://localhost:11434"
#     model: "qwen2.5-coder:1.5b"
#     options:
#       temperature: 0.1
#       num_ctx: 4096
#       num_predict: 1024
#   cloud:
#     type: openai_compat
#     base_url: "https://openrouter.ai/api/v1"
#     api_key_env: "OPENROUTER_API_KEY"  # export OPENROUTER_API_KEY=sk-or-...
#     model: "google/gemma-2-27b-it"
#     stream: true
#
# default_provider: local
# fallback_provider: cloud       # escalate to cloud after N failed steps in /goal
# fallback_after_failures: 2
#
# Cloud-only (e.g. Raspberry Pi without Ollama):
#   providers:
#     main:
#       type: openai_compat
#       base_url: "https://api.groq.com/openai/v1"
#       api_key_env: "GROQ_API_KEY"
#       model: "llama-3.3-70b-versatile"
#       stream: true
#   default_provider: main
# ───────────────────────────────────────────────────────────────────────────────

ollama:
  host: "http://localhost:11434"
  model: "qwen2.5-coder:1.5b"
  keep_alive: "30m"
  stream: true
  options:
    temperature: 0.2
    num_ctx: 4096    # raise to 8192 on machines with more RAM for longer conversations
    num_thread: 4    # set to your core count (Mac mini / Ubuntu server = 4–8)
    num_predict: 1024 # max tokens per response; 1024 fits most code files; lower for faster replies

agent:
  max_history: 8
  step_timeout_seconds: 300  # per-step deadline in goal/run mode (5 min); 0 = no timeout
  max_goal_steps: 10         # maximum steps for /run (quick one-shot mode)
  goal_max_steps: 50         # maximum steps for /goal (persistent mode); 0 = unlimited
  system_prompt: |
    You are a local coding assistant.
    For file and shell operations output ONLY a JSON object — no explanation, no markdown, nothing else.
    For questions and conversation reply in plain text.

    Write or create any file (code, script, config, text) — put the full content inside:
    {"name":"write_file","arguments":{"path":"hello.py","content":"print('Hello World')\n"}}

    Read a file:
    {"name":"read_file","arguments":{"path":"hello.py"}}

    Edit part of an existing file (find and replace):
    {"name":"edit_file","arguments":{"path":"hello.py","old_string":"print('hi')","new_string":"print('hello')"}}

    Append to an existing file:
    {"name":"append_file","arguments":{"path":"hello.py","content":"def greet(name):\n    print(name)\n"}}

    List a directory:
    {"name":"list_dir","arguments":{"path":"."}}

    Run a shell command:
    {"name":"run_command","arguments":{"command":"ls","args":["-la"]}}

    Fetch a web page or URL:
    {"name":"web_fetch","arguments":{"url":"https://example.com","timeout_seconds":30}}

    Search for text across files:
    {"name":"search_files","arguments":{"pattern":"TODO","path":"."}}

    Run a git command:
    {"name":"git","arguments":{"subcommand":"status","args":["--short"]}}

    Use write_file when asked to: create, write, make, generate, save, build a new file.
    Use edit_file when asked to: change, modify, fix, update part of an existing file.
    Use search_files when asked to: find, search, grep, look for text in files.
    Use run_command when asked to: run, execute, do, try any shell command.
    Use web_fetch when asked to: fetch, visit, browse, scrape, read any URL or website.
    Use git when asked to: check status, view log, diff, commit, push, or other git operations.
    Use plain text when: greeting, explaining, answering a question, describing something.

tools:
  enabled: true
  use_native_tools: false
  enable_read_file: true
  enable_write_file: true
  enable_edit_file: true        # find-and-replace edits on existing files
  enable_append_file: true
  enable_list_dir: true
  enable_run_command: true
  enable_web_fetch: false       # set true to allow the agent to fetch URLs
  web_fetch_timeout_seconds: 30 # per-request timeout for web_fetch
  enable_search_files: true     # search for text across files (pure Go, no grep needed)
  enable_git: false             # set true to allow git commands (requires git in PATH)
  confirm_run_command: true
  confirm_write_file: false     # set true to prompt before overwriting existing files
  confirm_git_write: true       # prompt before git commands that modify the repo (commit, push, etc.)
  allowed_commands:
    - cat
    - ls
    - pwd
    - grep
    - find
    - head
    - tail
    - sed
    - awk

# Telegram bot mode — run with: mini-agent --telegram
# SECURITY: do NOT put your bot token here. Use the TELEGRAM_BOT_TOKEN env var.
#   export TELEGRAM_BOT_TOKEN="your:token"
#   mini-agent --telegram
# To find your chat ID: message your bot, then check the update logs printed on startup.
telegram:
  allowed_chat_ids: []  # REQUIRED: add your Telegram chat ID(s) here, e.g. [123456789]
                        # Empty = deny all incoming messages (safe default)
